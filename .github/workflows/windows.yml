name: Windows package
on:
  workflow_dispatch:
  push:
    # The packaging test imports macos/build.py, which imports macos/install.py.
    paths: ['windows/**', 'extension/**', 'test/**', 'macos/build.py', 'macos/install.py', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Check matching and build the native Windows executable
        shell: pwsh
        run: |
          node --test test/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test/test_packaging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/LinkReuse/LinkReuse.csproj -c Release -r win-x64 --self-contained true -p:PublishAot=true -p:StripSymbols=true -o build/windows-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Start-Process -FilePath "$PWD/build/windows-native/LinkReuse.exe" -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput build/smoke-output.txt -RedirectStandardError build/smoke-error.txt
          Get-Content build/smoke-output.txt
          Get-Content build/smoke-error.txt
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }
      - name: Package for installation
        shell: pwsh
        run: python windows/package.py build/windows-native/LinkReuse.exe
      - uses: actions/upload-artifact@v7
        with:
          name: link-reuse-windows
          path: build/windows/*
  # Every push to main that changes what Windows ships publishes it: release windows-v<Version> and point the Scoop
  # bucket at it, so `scoop update link-reuse` sees it. The version is <Version> in windows/LinkReuse/LinkReuse.csproj.
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: link-reuse-windows
          path: build/windows
      - name: Publish the release and its Scoop manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version build/windows/link-reuse.json)
          shipped="extension windows/LinkReuse windows/SETUP.html windows/package.py"
          extension=$(jq -r .version extension/manifest.json)
          tag="windows-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            if ! git diff --quiet "$tag" HEAD -- $shipped; then
              echo "::error::Shipped files ($shipped) changed since $tag. Bump <Version> in windows/LinkReuse/LinkReuse.csproj to publish it."
              exit 1
            fi
            echo "$tag is already published; making sure the bucket lists it."
          else
            previous=$(git tag --list 'windows-v*' --sort=-v:refname | head -n 1)
            if [ -n "$previous" ] && ! git diff --quiet "$previous" HEAD -- extension &&
               [ "$(git show "$previous:extension/manifest.json" | jq -r .version)" = "$extension" ]; then
              echo "::error::extension/ changed since $previous but its version is still $extension. Bump extension/manifest.json so browsers reload it."
              exit 1
            fi
            gh release create "$tag" build/windows/* --target "$GITHUB_SHA" --title "Windows $version — shared extension $extension" --notes \
              "Bundles shared extension $extension and the native Windows $version app, built from $GITHUB_SHA after the shared JavaScript tests, packaging checks and native self-test passed. Update with \`scoop update link-reuse\`."
          fi
          # The bucket lists the release's own manifest, and only while main still ships this version: a newer one's
          # release lists itself. A failed push leaves the release in place, and running the job again finishes it.
          git fetch origin main
          current=$(git show origin/main:windows/LinkReuse/LinkReuse.csproj | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p')
          if [ "$current" != "$version" ]; then echo "main now ships Windows $current; its release lists it."; exit 0; fi
          git checkout --detach origin/main
          gh release download "$tag" --pattern link-reuse.json --output bucket/link-reuse.json --clobber
          git add bucket/link-reuse.json
          if git diff --cached --quiet; then echo "The bucket already lists Windows $version."; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish the Scoop manifest for Windows $version"
          git push origin HEAD:main
