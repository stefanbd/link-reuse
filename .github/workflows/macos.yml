name: macOS package
on:
  workflow_dispatch:
  push:
    paths: ['macos/**', 'extension/**', 'test/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Verify shared routing and native macOS bridge
        run: python3 test/run.py
      - name: Build universal application
        run: python3 macos/build.py
      - name: Package
        run: |
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          ditto -c -k --sequesterRsrc --keepParent 'build/products.noindex/Link Reuse.app' "build/link-reuse-macos-$version.zip"
          shasum -a 256 "build/link-reuse-macos-$version.zip" > "build/link-reuse-macos-$version.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: link-reuse-macos
          path: |
            build/link-reuse-macos-*.zip
            build/link-reuse-macos-*.sha256
